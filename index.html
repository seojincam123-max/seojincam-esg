<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>서진캠 2027년 ESG 표준지표 자가진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 평가 플랫폼처럼 왼쪽 부문 목록 + 오른쪽 문항 카드(2026 제출 내용 | 2027 관리 패널) */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EEF1F5; --line:#DCE1E8; --fg:#1C2430; --mute:#667285; --faint:#98A2B3;
  --navy:#1F3A5F; --navy-soft:#E6ECF4; --teal:#2E7D73; --teal-soft:#E3F1EE; --amber:#A8661C; --amber-soft:#FBF0E1;
  --red:#C0392B; --red-soft:#FBEAE8; --green:#2E7D32; --green-soft:#E6F3E7; --side:#1B2638; --side-fg:#C9D2DF; --side-hi:#FFFFFF;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161F; --surface:#18202C; --sunk:#1F2835; --line:#2C3747; --fg:#E4E9F0; --mute:#9AA6B6; --faint:#6B778A;
  --navy:#8FB0DA; --navy-soft:#1F2C40; --teal:#5FC0B2; --teal-soft:#16302D; --amber:#E0A55C; --amber-soft:#33281A;
  --red:#F08273; --red-soft:#3A1F1C; --green:#7BCB80; --green-soft:#1B3020; --side:#0C1118; --side-fg:#9AA6B6; --side-hi:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#18202C; --sunk:#1F2835; --line:#2C3747; --fg:#E4E9F0; --mute:#9AA6B6; --faint:#6B778A;
  --navy:#8FB0DA; --navy-soft:#1F2C40; --teal:#5FC0B2; --teal-soft:#16302D; --amber:#E0A55C; --amber-soft:#33281A;
  --red:#F08273; --red-soft:#3A1F1C; --green:#7BCB80; --green-soft:#1B3020; --side:#0C1118; --side-fg:#9AA6B6; --side-hi:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-.01em;color:var(--navy)}
.brand span{font-size:12px;color:var(--mute)}
.meta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.meta strong{color:var(--fg);font-weight:600}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--teal)}
.lock{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.lock.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tabs a{padding:7px 14px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:600;font-size:13.5px;white-space:nowrap}
.tabs a.on{background:var(--navy-soft);color:var(--navy)}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100% - 110px)}
.side{background:var(--side);color:var(--side-fg);padding:16px 10px;position:sticky;top:110px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}
.side h4{font-size:11px;letter-spacing:.08em;color:var(--faint);margin:14px 10px 6px;text-transform:uppercase;display:flex;justify-content:space-between}
.side button{display:flex;width:100%;justify-content:space-between;gap:8px;background:none;border:0;color:inherit;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:rgba(255,255,255,.12);color:var(--side-hi);font-weight:600}
.side .cnt{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.side .cnt.full{color:#7BCB80}
.side .cnt.strong{color:var(--side-hi);font-weight:600}
.side .grp{padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .grp:last-child{border-bottom:0}
.side h4{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:600}
.side button.sub{font-weight:600;color:var(--side-hi)}
.side button.sub span:first-child{display:flex;align-items:center;gap:8px}
.side .chev{width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);display:inline-block;transition:transform .15s}
.side button.sub.open .chev{transform:rotate(-135deg) translate(-1px,-1px)}
.side button.cat.in{padding-left:26px}
.side button svg{flex:none}
.main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.crumb{color:var(--mute);font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--fg);font-size:16px}
.catsel{display:none;width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);margin-bottom:14px}
.q{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;scroll-margin-top:130px}
.q.flash{box-shadow:0 0 0 3px var(--teal)}
.q-main{padding:18px 20px;min-width:0}
.q-side{padding:18px 20px;border-left:1px solid var(--line);background:var(--sunk);border-radius:0 var(--r) var(--r) 0;min-width:0;display:flex;flex-direction:column;gap:14px}
.qh{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.qid{font-family:var(--f-mono);font-size:12px;font-weight:600;border:1.5px solid var(--fg);border-radius:999px;padding:1px 9px;white-space:nowrap;margin-top:2px}
.qh h3{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-미착수{background:var(--sunk);color:var(--mute)} .st-진행중{background:var(--amber-soft);color:var(--amber)} .st-완료{background:var(--green-soft);color:var(--green)} .st-해당없음{background:var(--sunk);color:var(--faint)}
.off-note{color:var(--faint);font-size:13px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:13.5px}
.opt .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:3px;position:relative}
.opt.on .dot{border-color:var(--teal)} .opt.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--teal)}
.opt.no{color:var(--faint)}
.opt.on>span{font-weight:500}
.ev{margin:6px 0 8px 24px;display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:7px;padding:7px 10px;font-size:12.5px;min-width:0}
.file svg{flex:none;color:var(--mute)}
.file span{min-width:0;overflow-wrap:anywhere;color:var(--teal)}
.file .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--faint);font-size:16px;line-height:1;padding:0 2px}
.file .x.sure{color:var(--red);font-size:12px;font-weight:700}
.q-side .file{background:var(--surface)}
.ans{border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12.5px;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto;background:var(--surface)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;margin:4px 0 8px 24px;font-size:12.5px}
.kv span{color:var(--mute)} .kv b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
details.more{margin:2px 0 4px 24px;font-size:12.5px;color:var(--mute)}
details.more summary{cursor:pointer}
.lbl{font-size:11.5px;font-weight:700;color:var(--mute);letter-spacing:.04em;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.val{font-weight:600;font-size:13.5px}
.q-side select,.q-side textarea,.q-side input[type=text]{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 8px;font-size:13px}
.q-side textarea{min-height:70px;resize:vertical}
.memo-view{white-space:pre-wrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px;color:var(--fg)}
.memo-view.empty{color:var(--faint)}
ul.ref{margin:0;padding-left:16px;font-size:12.5px;color:var(--fg)}
ul.ref li{margin:2px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;border-radius:6px;padding:2px 8px;background:var(--navy-soft);color:var(--navy);font-weight:600}
.iss{font-size:12.5px;border-radius:7px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start}
.iss.p-상{background:var(--red-soft)} .iss.p-중{background:var(--amber-soft)} .iss.p-하{background:var(--green-soft)}
.pri{font-weight:700;font-size:11px;border-radius:5px;padding:1px 7px;color:#fff;flex:none}
.pri.p-상{background:var(--red)} .pri.p-중{background:var(--amber)} .pri.p-하{background:var(--green)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn.pri2{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:11.5px;color:var(--faint)}
/* tables */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface);font-size:13px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:700;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td select,td input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-size:12.5px;width:100%}
tr.grp td{background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:13px}
.m-1월,.m-5월,.m-9월{color:#4A6FA5} .m-2월,.m-6월,.m-10월{color:var(--teal)} .m-3월,.m-7월,.m-11월{color:var(--amber)} .m-4월,.m-8월,.m-12월{color:#8E4B6E}
.m-1월,.m-2월,.m-3월,.m-4월,.m-5월,.m-6월,.m-7월,.m-8월,.m-9월,.m-10월,.m-11월,.m-12월{font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ubar{display:flex;align-items:center;gap:8px}
.ubar i{height:8px;border-radius:4px;background:var(--amber);display:block}
.qlink{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:1px;display:inline-block;cursor:pointer;background:var(--surface);color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--navy)}
.nums{display:flex;gap:18px;margin-bottom:10px}
.nums div{display:flex;flex-direction:column}
.nums b{font-size:22px;font-family:var(--f-mono);color:var(--fg)}
.nums span{font-size:11.5px;color:var(--mute)}
.issue-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 200px;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.issue-row h4{margin:0 0 4px;font-size:13.5px}
.lastf{font-size:12.5px;color:var(--mute);line-height:1.6;overflow-wrap:anywhere}
.tag26{display:inline-block;font-size:10.5px;font-weight:700;color:var(--navy);background:var(--navy-soft);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lastf .sep{color:var(--faint)}
ol.lastlist{margin:0 0 4px;padding-left:20px;font-size:12.5px;color:var(--fg)}
ol.lastlist li{margin:1px 0;overflow-wrap:anywhere}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;cursor:pointer;background:var(--surface);margin-bottom:6px}
.drop b{font-size:13px;color:var(--teal)} .drop span{font-size:11.5px;color:var(--faint)}
.drop:hover{border-color:var(--teal)}
.q.dragover{box-shadow:0 0 0 3px var(--teal)} .q.dragover .drop{border-color:var(--teal);background:var(--teal-soft)}
.tm-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tm-row input[type=text]{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);width:180px;font-size:13px}
.tm-row .hint{min-width:110px}
.tm-del{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.tm-del select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-size:12.5px}
.tm-add{border-top:1px solid var(--line);padding-top:10px}
.dlb{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px;display:flex}
.dlb:hover{color:var(--teal)}
.file .x{margin-left:0}
.file a{min-width:0;overflow-wrap:anywhere;margin-right:auto}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.tile b{font-size:28px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12.5px;color:var(--mute);font-weight:600}
.tile.t-done b{color:var(--green)} .tile.t-ing b{color:var(--amber)} .tile.t-todo b{color:var(--fg)} .tile.t-na b{color:var(--faint)} .tile.t-all b{color:var(--navy)}
.home{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{margin:0 0 12px;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-weight:500;color:var(--mute);font-size:12px}
.prow{display:grid;grid-template-columns:132px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.sbar i{display:block;height:100%}
.sbar .b-done{background:var(--green)} .sbar .b-ing{background:var(--amber)} .sbar .b-na{background:var(--faint);opacity:.5}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.li:first-of-type{border-top:0}
.li p{margin:0;min-width:0;overflow-wrap:anywhere}
.li .who{color:var(--mute);font-size:11.5px}
.li:hover p{color:var(--teal)}
@media (max-width:980px){.home{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.issue-row p{margin:0;font-size:13px}
.issue-row .act{color:var(--navy);font-weight:600}
.issue-row select,.issue-row input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--surface);font-size:12.5px;margin-bottom:6px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.banner.edit{background:var(--teal-soft);color:var(--teal)}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal-box{background:var(--surface);border-radius:12px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.modal-box h3{margin:0;font-size:16px}
.modal-box input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface)}
.err{color:var(--red);font-size:12.5px;min-height:18px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30}
.empty-box{padding:30px;text-align:center;color:var(--mute)}
@media (max-width:980px){.q{grid-template-columns:1fr}.q-side{border-left:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}.issue-row{grid-template-columns:auto minmax(0,1fr)}.issue-row>*:nth-child(n+3){grid-column:2}}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.side{display:none}.catsel{display:block}.meta .bar{width:70px}.grid2{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><b>서진캠 2027년 ESG 표준지표 자가진단</b><span>2026년 제출 기록(FY2025 데이터) 기반 · 2027 평가 준비 현황</span></div>
    <div class="meta"><span>답변 문항 <strong id="m-q"></strong></span><span>2027 준비 <strong id="m-p"></strong> <span class="bar"><i id="m-bar" style="width:0"></i></span></span></div>
    <button class="lock" id="lockBtn" type="button"></button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#home" data-v="home">현황</a>
    <a href="#data" data-v="data">자가진단 데이터</a>
    <a href="#plan" data-v="plan">준비 계획</a>
    <a href="#issues" data-v="issues">보완사항</a>
    <a href="#evidence" data-v="evidence">증빙 재사용</a>
    <a href="#teams" data-v="teams">담당 팀</a>
  </nav>
</header>
<div class="wrap" id="wrap">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>

function rowsHTML(q){
  if(q.off)return '<div class="off-note">사전 질문 응답상 해당 없음(비활성) 문항입니다.</div>';
  const rows=q.rows;let out='',stack=[];let pendingNo=[];
  const flushNo=()=>{if(pendingNo.length>4){out+=`<details class="more"><summary>선택하지 않은 항목 ${pendingNo.length}개</summary>${pendingNo.join('')}</details>`}else out+=pendingNo.join('');pendingNo=[]};
  let kv=[];const flushKv=()=>{if(kv.length){out+=`<div class="kv">${kv.join('')}</div>`;kv=[]}};
  for(const r of rows){
    const[id,depth,text,kind,on,ans,files]=r;
    stack=stack.filter(s=>s.depth<depth);
    if(stack.some(s=>s.kind==='opt'&&!s.on))continue;
    stack.push({depth,kind,on});
    const pad=`style="margin-left:${(depth-1)*22}px"`;
    if(kind==='opt'&&!on){flushKv();pendingNo.push(`<div class="opt no" ${pad}><i class="dot"></i><span>${esc(text)}</span></div>`);continue}
    flushNo();
    if(kind==='in'&&!files.length&&(ans.length<60)&&text.length<70){kv.push(`<span>${esc(text)}</span><b>${esc(ans||'—')}</b>`);continue}
    flushKv();
    out+=kind==='opt'?`<div class="opt on" ${pad}><i class="dot"></i><span>${esc(text)}</span></div>`:`<div class="opt" ${pad}><span style="color:var(--mute)">${esc(text)}</span></div>`;
    if(files.length||ans){out+=`<div class="ev" style="margin-left:${(depth-1)*22+24}px">`+(files.length?`<div class="lastf"><span class="tag26">2026 첨부</span>${files.map(f=>esc(f.replace(/\.(pdf|xlsx|jpg)$/i,''))).join('<span class="sep"> · </span>')}</div>`:'')+(ans?`<div class="ans">${esc(ans)}</div>`:'')+'</div>'}
  }
  flushNo();flushKv();return out}

async function save(col,id,patch){
  if(!S.api){toast('API 주소가 설정되지 않아 저장하지 못했습니다');return false}
  const cur=S.ov[col][id]||{};const next={...cur,...patch,updatedAt:Date.now()};
  S.ov[col][id]=next;S.saving++;
  try{await api('save',{col,id,data:next});S.canWrite=true;toast('저장됨');return true}
  catch(e){S.canWrite=false;S.ov[col][id]=cur;authFail(e)||toast('저장하지 못했습니다. 잠시 후 다시 시도하세요');render();return false}
  finally{S.saving--}}
async function api(action,payload={}){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,action,password:S.pw})});
  if(!r.ok)throw{code:'http_'+r.status};const j=await r.json();if(j.error)throw{code:j.error};return j}

async function upload(qid,list){
  if(!S.api){toast('API 주소가 설정되지 않아 첨부할 수 없습니다');return}
  const q=Q[qid];const files=[...qv(q).files];let added=0;
  for(const f of list){
    if(f.size>25*1048576){toast(f.name+' — 25MB를 넘어 첨부할 수 없습니다');continue}
    toast(f.name+' 올리는 중…');
    try{const data=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]||'');fr.onerror=no;fr.readAsDataURL(f)});
      const r=await api('upload',{qid,name:f.name,type:f.type||'application/octet-stream',data});
      files.push({id:r.id,name:r.name||f.name,size:r.size||f.size,type:r.type||f.type,url:r.url,at:Date.now()});added++}
    catch(err){if(authFail(err))return;toast('첨부하지 못했습니다: '+f.name)}}
  if(added)await save('q',key(qid),{files});render()}

  if(!S.api){document.getElementById('pwErr').textContent='API 주소가 설정되지 않았습니다 (index.html의 API_URL).';return}
  document.getElementById('pwErr').textContent='확인 중…';
  try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',password:pw})}).then(x=>x.json());
    if(r.ok){S.pw=pw;S.edit=true;S.canWrite=null;try{sessionStorage.setItem('esg.pw',pw)}catch(_){}document.getElementById('modal').hidden=true;render();toast('편집 모드로 전환했습니다')}
    else document.getElementById('pwErr').textContent='비밀번호가 맞지 않습니다.'}
  catch(e){document.getElementById('pwErr').textContent='서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.'}});

// ---------- boot
S.saving=0;
route();
load();
setInterval(()=>{if(document.visibilityState==='visible'&&!S.saving)load()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!S.saving)load()});
</script>
</body>
</html>
